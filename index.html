<script>
(function() {
  'use strict';

  // Preloader
  window.addEventListener('load', function() {
    var pl = document.getElementById('preloader');
    if (!pl) return;
    pl.classList.add('hidden');
    setTimeout(function() { pl.style.display = 'none'; }, 500);
  });

  // Mobile menu
  var menuToggle = document.querySelector('.menu-toggle');
  var navMenu = document.getElementById('nav-menu');
  if (menuToggle && navMenu) {
    menuToggle.addEventListener('click', function() {
      var open = navMenu.classList.toggle('open');
      menuToggle.classList.toggle('active');
      menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    document.querySelectorAll('#nav-menu a').forEach(function(a) {
      a.addEventListener('click', function() {
        navMenu.classList.remove('open');
        menuToggle.classList.remove('active');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }

  // Nav scroll effect
  var nav = document.querySelector('nav');
  var lastScroll = 0;
  window.addEventListener('scroll', function() {
    var y = window.pageYOffset || document.documentElement.scrollTop;
    if (y > 40) {
      nav.classList.add('scrolled');
    } else {
      nav.classList.remove('scrolled');
    }
    lastScroll = y;
  }, { passive: true });

  // Hero parallax
  var heroLogo = document.getElementById('hero-logo');
  if (heroLogo) {
    window.addEventListener('scroll', function() {
      var y = window.pageYOffset || document.documentElement.scrollTop;
      var ratio = Math.min(y / 600, 0.5);
      heroLogo.style.transform = 'translateY(' + (y * 0.08) + 'px)';
    }, { passive: true });
  }

  // Nav logo hover swap (3D version on hover)
  var navLogo = document.getElementById('nav-logo');
  if (navLogo) {
    navLogo.addEventListener('mouseenter', function() {
      var tmp = navLogo.src;
      navLogo.src = navLogo.src.replace('_nav', '_merged_pro');
    });
    navLogo.addEventListener('mouseleave', function() {
      var tmp = navLogo.src;
      navLogo.src = navLogo.src.replace('_merged_pro', '_nav');
    });
  }

  // Smooth scroll for nav links
  document.querySelectorAll('a[href^="#"]').forEach(function(anchor) {
    anchor.addEventListener('click', function(e) {
      var href = anchor.getAttribute('href');
      if (href === '#') return;
      var target = document.querySelector(href);
      if (!target) return;
      e.preventDefault();
      var offset = 80;
      var top = target.getBoundingClientRect().top + window.pageYOffset - offset;
      window.scrollTo({ top: top, behavior: 'smooth' });
    });
  });

  // Logging
  console.log('%c🧹 Magaetswale Solutions', 'font-size:16px;font-weight:bold;color:#22c55e');
  console.log('%cBuilt with care by Tshepo Motshoni', 'color:#8a8a8a;font-size:12px');
  console.log('%cPortfolio: tshepo-motshoni.vercel.app', 'color:#d4a574;font-size:12px');
})();
</script>
</body>
</html>
